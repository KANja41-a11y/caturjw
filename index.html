<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Catur Jawa</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <header class="header">
      <p class="label">PERMAINAN TRADISIONAL</p>

      <h1>Catur <span>Jawa</span></h1>

      <p class="subtitle">
        Strategi kecil, langkah yang berarti.
      </p>
    </header>


    <main class="game">

      <section class="players">

        <div class="player red-player active" id="redPlayer">
          <div class="avatar red"></div>

          <div>
            <small>PEMAIN 1</small>
            <h2>Merah</h2>
          </div>
        </div>


        <div class="vs">
          VS
        </div>


        <div class="player blue-player" id="bluePlayer">
          <div class="avatar blue"></div>

          <div>
            <small>PEMAIN 2</small>
            <h2>Biru</h2>
          </div>
        </div>

      </section>


      <section class="game-info">

        <div class="turn">
          <span>GILIRAN</span>
          <strong id="turnText">Pemain 1</strong>
        </div>

        <p id="message">
          Pilih salah satu bidak merah.
        </p>

      </section>


      <section class="board-section">

        <div class="board" id="board">

          <!-- garis horizontal -->
          <span class="h-line h1"></span>
          <span class="h-line h2"></span>

          <!-- garis vertikal -->
          <span class="v-line v1"></span>
          <span class="v-line v2"></span>

          <!-- garis diagonal -->
          <span class="d-line d1"></span>
          <span class="d-line d2"></span>


          <!-- titik permainan -->

          <button class="point" data-position="0"></button>
          <button class="point" data-position="1"></button>
          <button class="point" data-position="2"></button>

          <button class="point" data-position="3"></button>
          <button class="point" data-position="4"></button>
          <button class="point" data-position="5"></button>

          <button class="point" data-position="6"></button>
          <button class="point" data-position="7"></button>
          <button class="point" data-position="8"></button>

        </div>

      </section>


      <section class="score">

        <div class="score-item">
          <span class="score-color red"></span>
          <small>MERAH</small>
          <strong id="redScore">0</strong>
        </div>

        <div class="score-item center">
          <small>RONDE</small>
          <strong id="round">1</strong>
        </div>

        <div class="score-item">
          <span class="score-color blue"></span>
          <small>BIRU</small>
          <strong id="blueScore">0</strong>
        </div>

      </section>


      <button class="reset" id="reset">
        ↻ Mulai Ulang
      </button>

    </main>


    <footer>
      <span>✦</span>
      Catur Jawa
      <span>✦</span>
    </footer>

  </div>


  <!-- MODAL PEMENANG -->

  <div class="modal" id="modal">

    <div class="modal-box">

      <div class="ornament">
        ✦
      </div>

      <p>PEMENANG</p>

      <h2 id="winner">
        Pemain 1
      </h2>

      <div class="winner-piece" id="winnerPiece"></div>

      <button id="playAgain">
        Main Lagi
      </button>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
